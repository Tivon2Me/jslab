<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltSpot - Book a Charger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="brand-header">
            <h1>⚡ VoltSpot EV Network</h1>
            <p class="tagline">Reserve Your Slot</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="stations.html">Stations</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="reserve.html" class="active">Book a Charger</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Charging Bay Reservation Form</h2>

            <form id="reservation-form" action="process_reserve.php" method="POST" novalidate>
                <div class="form-group">
                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="location">Select Charging Station *</label>
                    <select id="location" name="location">
                        <option value="">-- Choose Hub Location --</option>
                        <option value="Downtown Central Hub">Downtown Central Hub</option>
                        <option value="Westside Mall Plaza">Westside Mall Plaza</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Reservation Date *</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="form-group">
                    <label for="time">Estimated Arrival Time *</label>
                    <input type="time" id="time" name="time">
                </div>

                <button type="submit" class="btn">Confirm Reservation</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VoltSpot Charging Network.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
